    <script>
      (function() {
        function isExternalScriptError(msg, src) {
          return msg === 'Script error.' ||
            (typeof msg === 'string' && (msg.indexOf('disqus') !== -1 || msg.indexOf('Disqus') !== -1)) ||
            (typeof src === 'string' && (src.indexOf('disqus') !== -1 || src.indexOf('disquscdn') !== -1));
        }
        window.addEventListener('error', function(event) {
          if (isExternalScriptError(event.message, event.filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
        var origOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, colNo, err) {
          if (isExternalScriptError(msg, url)) {
            return true;
          }
          if (typeof origOnError === 'function') {
            return origOnError.apply(this, arguments);
          }
          return false;
        };
        window.addEventListener('unhandledrejection', function(event) {
          var str = event.reason ? (event.reason.message || String(event.reason)) : '';
          if (isExternalScriptError(str, '')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
